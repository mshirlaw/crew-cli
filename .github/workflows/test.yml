name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      - name: Install tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      # The same shellcheck version everywhere, so Linux and macOS agree.
      - name: Install shellcheck
        run: |
          python3 -m venv "$RUNNER_TEMP/shellcheck"
          "$RUNNER_TEMP/shellcheck/bin/pip" install --quiet shellcheck-py==0.11.0.1
          echo "$RUNNER_TEMP/shellcheck/bin" >> "$GITHUB_PATH"

      - name: Formatting
        run: cargo fmt --check

      # Each finding becomes an annotation on the run, so it's readable without the full log.
      - name: Clippy
        run: |
          echo "::notice::$(rustc --version)"
          status=0
          cargo clippy --all-targets --message-format=short -- -D warnings 2> clippy.out || status=$?
          cat clippy.out
          sed -nE 's/^([^ :]+):([0-9]+):([0-9]+): (error|warning): (.*)/::error file=\1,line=\2,col=\3::\5/p' clippy.out
          exit "$status"

      - name: Unit tests
        run: cargo test

      - name: Shellcheck
        run: shellcheck install.sh test/run.sh

      - name: End-to-end tests
        run: test/run.sh
