name: release

# Push a tag like v0.6.0 to build crew for every platform and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Check the tag matches Cargo.toml
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"; exit 1; }

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          dir="$RUNNER_TEMP/crew"
          mkdir -p "$dir"
          cp "target/${{ matrix.target }}/release/crew" LICENSE README.md "$dir/"
          tar -czf "crew-${{ matrix.target }}.tar.gz" -C "$dir" .
          if command -v sha256sum >/dev/null; then sha256sum "crew-${{ matrix.target }}.tar.gz"; else shasum -a 256 "crew-${{ matrix.target }}.tar.gz"; fi > "crew-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: crew-${{ matrix.target }}
          path: crew-${{ matrix.target }}.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
